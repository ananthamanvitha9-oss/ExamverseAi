<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExamVerse AI | Contact Us</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./Frontend/css/style.css">
</head>
<body>
  <!-- Header with Navigation -->
  <header class="hero" style="min-height: auto; padding-bottom: 1rem;">
    <nav class="nav container">
      <a class="brand" href="./index.html">
        <img src="./images/logo.jpg" alt="ExamVerse AI Logo" width="160" height="40" style="border-radius:6px; vertical-align:middle; margin-right:8px;">
        <span>ExamVerse AI</span>
      </a>
      <nav class="nav-links">
        <a href="./index.html">Home</a>
        <a href="./about.html">About</a>
        <a href="./contact.html" style="color: var(--text);">Contact</a>
        <a href="./login.html" class="btn btn-secondary" style="padding: 0.5rem 1rem;">Login</a>
        <a href="./register.html" class="btn btn-primary" style="padding: 0.5rem 1.1rem;">Register</a>
      </nav>
    </nav>
  </header>

  <!-- Main Contact Content -->
  <main class="container" style="padding: 3rem 0;">
    <section class="cta-box" style="max-width: 600px; margin: 0 auto; text-align: left;">
      <h2 style="text-align: center;">Get In Touch</h2>
      <p class="subtitle" style="text-align: center;">Have any questions or need help? Send us a message.</p>

      <form id="contact-form" class="cta-form" style="margin-top: 1.5rem;">
        <div class="form-group">
          <label for="name" style="font-size: 0.88rem; font-weight: 600; color: var(--muted); display: block; margin-bottom: 0.4rem;">Full Name</label>
          <input type="text" id="name" required placeholder="Enter your full name">
        </div>
        <div class="form-group">
          <label for="email" style="font-size: 0.88rem; font-weight: 600; color: var(--muted); display: block; margin-bottom: 0.4rem;">Email Address</label>
          <input type="email" id="email" required placeholder="name@example.com">
        </div>
        <div class="form-group">
          <label for="subject" style="font-size: 0.88rem; font-weight: 600; color: var(--muted); display: block; margin-bottom: 0.4rem;">Subject</label>
          <input type="text" id="subject" required placeholder="What is this about?">
        </div>
        <div class="form-group">
          <label for="message" style="font-size: 0.88rem; font-weight: 600; color: var(--muted); display: block; margin-bottom: 0.4rem;">Message</label>
          <textarea id="message" rows="5" required placeholder="Type your message here..." style="width: 100%; padding: 0.85rem 1.1rem; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 0.75rem; color: var(--text); font-family: inherit; font-size: 0.95rem; outline: none;"></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-submit" style="margin-top: 0.5rem;">Send Message</button>
      </form>
      <div id="form-message" class="form-message hidden" style="margin-top: 1rem; text-align: center;"></div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer-content">
      <p>© <span id="year"></span> ExamVerse AI. All rights reserved. Built for competitive exam learners.</p>
      
      <div class="footer-links">
        <a href="./contact.html">Contact Support</a>
        <span>•</span>
        <a href="mailto:support@examverse.ai">support@examverse.ai</a>
        <span>•</span>
        <a href="./about.html">About Us</a>
      </div>

      <div class="social-links">
        <a href="https://github.com" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
        <a href="https://twitter.com" target="_blank" rel="noopener noreferrer">Twitter ↗</a>
        <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer">LinkedIn ↗</a>
        <a href="https://telegram.org" target="_blank" rel="noopener noreferrer">Telegram ↗</a>
        <a href="https://youtube.com" target="_blank" rel="noopener noreferrer">YouTube ↗</a>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
