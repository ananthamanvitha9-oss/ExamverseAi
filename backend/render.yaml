databases:
  - name: examverse-db
    databaseName: examverse
    user: examverse_user

services:
  - type: web
    name: examverse-api
    env: php
    plan: free
    buildCommand: "composer install --no-dev --optimize-autoloader"
    startCommand: "php -S 0.0.0.0:$PORT -t public"
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: "https://examverse-api.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: examverse-db
          property: connectionString
      - key: DB_CONNECTION
        value: pgsql
      - key: FRONTEND_URL
        value: "https://your-vercel-app-url.vercel.app"
    # Note: Add your other sensitive keys (GEMINI_API_KEY, RAZORPAY_KEY_ID, etc.) securely via the Render Dashboard.
