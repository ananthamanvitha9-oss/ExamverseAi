<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExamVerse AI | Contact Us</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <header class="header">
    <div class="container nav">
      <a href="./index.html" class="brand">ExamVerse AI</a>
      <nav class="nav-links">
        <a href="./index.html">Home</a>
        <a href="./about.html">About</a>
        <a href="./contact.html" style="color: var(--text);">Contact</a>
        <a href="./login.html" class="btn btn-secondary">Login</a>
        <a href="./register.html" class="btn btn-primary">Register</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="form-container">
      <h2>Get In Touch</h2>
      <p class="subtitle">Have any questions or need help? Send us a message.</p>

      <form id="contact-form">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" required placeholder="Enter your full name">
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" required placeholder="name@example.com">
        </div>
        <div class="form-group">
          <label for="subject">Subject</label>
          <input type="text" id="subject" required placeholder="What is this about?">
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" rows="5" required placeholder="Type your message here..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Send Message</button>
      </form>
      <div id="form-message" class="form-message hidden" style="margin-top: 1rem; text-align: center;"></div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© <span id="year"></span> ExamVerse AI. All rights reserved. Built for competitive exam learners.</p>
    </div>
  </footer>

  <script src="./js/script.js"></script>
</body>
</html>
