<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExamVerse AI | Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/dashboard.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="container nav">
      <a href="./index.html">
        <img src="./images/logo.jpg" alt="ExamVerse AI Logo" width="180" height="45" style="border-radius:6px; vertical-align:middle;">
      </a>
      <nav class="nav-links">
        <button id="theme-toggle" class="btn btn-secondary" style="margin-right: 1rem; cursor: pointer; padding: 0.4rem 0.8rem; font-size: 0.85rem;">☀️ Light Mode</button>
        <a href="./index.html">Home</a>
        <a href="./dashboard.html" style="color: var(--primary-2);">Dashboard</a>
        <a href="./login.html" class="btn btn-secondary">Logout</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="dashboard-wrapper" style="margin-top: 3rem;">
      <!-- Welcome Section (Step 12) -->
      <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2rem;">
        <div>
          <h1 id="welcome-message" style="margin-bottom: 0.5rem;">Welcome back, Student!</h1>
          <p class="lead" style="margin: 0; font-size: 1.1rem;">
            Target Exam: <strong id="selected-exam" style="color: var(--primary-2);">Loading...</strong> 
            | Language: <span id="selected-language">Loading...</span>
          </p>
        </div>
        <button id="edit-profile-btn" class="btn btn-secondary">Edit Profile</button>
      </div>

      <!-- Stats Grid -->
      <div class="features-grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); margin-bottom: 3rem;">
        
        <article class="card" style="text-align: center;">
          <h3 style="font-size: 1.2rem; color: var(--muted); margin-bottom: 0.5rem;">Study Streak</h3>
          <div style="font-size: 2.5rem; font-weight: 800; color: #ff9f43; margin-bottom: 0.5rem;">
            <span id="streak-counter">0</span> 🔥
          </div>
          <p style="font-size: 0.85rem; color: var(--muted); margin:0;">Days in a row</p>
        </article>

        <article class="card" style="text-align: center;">
          <h3 style="font-size: 1.2rem; color: var(--muted); margin-bottom: 0.5rem;">Syllabus Progress</h3>
          <div style="font-size: 2.5rem; font-weight: 800; color: #7ee787; margin-bottom: 0.5rem;">
            <span id="progress-percentage">0</span>%
          </div>
          <!-- Simple CSS Progress Bar -->
          <div style="width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden;">
            <div id="progress-bar" style="width: 0%; height: 100%; background: #7ee787; transition: width 1s ease;"></div>
          </div>
        </article>

      </div>
    </section>
  </main>

  <!-- Scripts -->
  <script src="./js/utils.js"></script>
  <script src="./js/theme.js"></script>
  <script src="./js/dashboard.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
